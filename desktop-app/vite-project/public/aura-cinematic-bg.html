<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURA</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  canvas { display: block; position: fixed; inset: 0; }

  #ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 52px;
    pointer-events: none;
    z-index: 10;
  }

  #caption {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    opacity: 0;
    transition: opacity 0.6s cubic-bezier(0.25,0,0,1);
    margin-bottom: 20px;
    height: 14px;
  }

  #label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    opacity: 0;
    transition: opacity 0.9s cubic-bezier(0.25,0,0,1);
  }

  #label.visible { opacity: 1; }

  #title {
    margin-top: 14px;
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 200;
    letter-spacing: 0.34em;
    color: rgba(255,255,255,0.9);
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.25,0,0,1) 0.25s;
  }

  #title.visible { opacity: 1; }

  #dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    margin-top: 28px;
    opacity: 0;
    transition: opacity 0.8s ease 1s;
  }
  #dot.visible { opacity: 1; }
#ui { display: none !important; }</style>
</head>
<body>

<div id="ui">
  <div id="caption"></div>
  <div id="label">Autonomous Understanding and Reasoning Agents</div>
  <div id="title">A U R A</div>
  <div id="dot"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js";

// ─── Constants ───────────────────────────────────────────────────────────────
const COUNT   = 18000;
const W = window.innerWidth, H = window.innerHeight;

// ─── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, W/H, 0.01, 200);
camera.position.set(0, 0, 6.5);

// ─── Shape generators — each maps to an AURA agent or system concept ──────────
// All return Float32Array of length count*3.
// Outlier particles (5–8 %) are always added for cymatic realism.

function hash1(n) { return ((Math.sin(n) * 43758.5453) % 1 + 1) % 1; }

function addOutliers(pts, filled, count, spreadScale) {
  while (filled < count) {
    const r = spreadScale * (0.8 + Math.random() * 3.0); // much wider random spread to edges
    const a = Math.random() * Math.PI * 2;
    pts[filled*3]   = Math.cos(a) * r;
    pts[filled*3+1] = Math.sin(a) * r;
    pts[filled*3+2] = (Math.random()-0.5) * 1.5;
    filled++;
  }
}

// 0 · CHAOS — raw unstructured input, the world before AURA
function chaosField(count) {
  const pts = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = Math.pow(Math.random(), 0.45) * 7.5; // extended from 3.4 to fill edges
    const a = Math.random() * Math.PI * 2;
    pts[i*3]   = Math.cos(a) * r;
    pts[i*3+1] = Math.sin(a) * r;
    pts[i*3+2] = (Math.random()-0.5) * 2.0;
  }
  return pts;
}

// 1 · LANGUAGE AGENT — voice, breath, listening
//   A single soft pulse ring with harmonic overtones: sound-wave cross-section.
//   Cymatic basis: radially-symmetric standing pressure wave (drum membrane mode 01).
function voicePulse(count, scale = 2.3) {
  const pts  = new Float32Array(count * 3);
  // Three harmonic rings at radii proportional to Bessel zeros: 1.0, 1.64, 2.23
  const rings = [
    { r: 0.38, w: 0.055, weight: 0.55 },
    { r: 0.68, w: 0.045, weight: 0.30 },
    { r: 1.00, w: 0.035, weight: 0.15 },
  ];
  let filled = 0;
  const inner = Math.floor(count * 0.93);
  for (let i = 0; i < inner; i++) {
    // pick ring by weight
    const rnd = Math.random();
    let ring = rings[0];
    let acc = 0;
    for (const rg of rings) { acc += rg.weight; if (rnd < acc) { ring = rg; break; } }

    const angle    = Math.random() * Math.PI * 2;
    const radNoise = (Math.random()-0.5) * ring.w * 2;
    const r        = (ring.r + radNoise) * scale;

    // Subtle angular modulation — voice is never a perfect circle
    const mod = 1 + 0.06 * Math.sin(6 * angle) + 0.03 * Math.cos(11 * angle);
    pts[filled*3]   = Math.cos(angle) * r * mod;
    pts[filled*3+1] = Math.sin(angle) * r * mod;
    pts[filled*3+2] = (Math.random()-0.5) * 0.07;
    filled++;
  }
  addOutliers(pts, filled, count, scale);
  return pts;
}

// 2 · REASONING AGENT — thought, pattern recognition, inference
//   A sparse neural web: N hub-nodes + arcs sampled densely along edges between them.
//   Evokes synaptic graphs and graph-of-thought architectures.
function neuralWeb(count, scale = 2.2) {
  const pts  = new Float32Array(count * 3);
  const HUBS = 9;
  // Place hubs on a perturbed circle
  const hx = [], hy = [];
  for (let h = 0; h < HUBS; h++) {
    const a = (h / HUBS) * Math.PI * 2 + hash1(h * 7.3) * 0.4;
    const r = scale * (0.55 + hash1(h * 13.7) * 0.45);
    hx.push(Math.cos(a) * r);
    hy.push(Math.sin(a) * r);
  }
  // Dense particles at hub centres
  const perHub  = Math.floor(count * 0.18 / HUBS);
  let filled = 0;
  for (let h = 0; h < HUBS && filled < count * 0.18; h++) {
    for (let p = 0; p < perHub && filled < count; p++) {
      const off = 0.07;
      pts[filled*3]   = hx[h] + (Math.random()-0.5)*off;
      pts[filled*3+1] = hy[h] + (Math.random()-0.5)*off;
      pts[filled*3+2] = (Math.random()-0.5)*0.06;
      filled++;
    }
  }
  // Sparse arcs along edges (not every hub pair — selective for elegance)
  const edges = [];
  for (let a = 0; a < HUBS; a++) {
    for (let b = a+1; b < HUBS; b++) {
      if (hash1(a * 17 + b * 31) < 0.55) edges.push([a, b]);
    }
  }
  const perEdge = Math.floor((count * 0.75) / Math.max(edges.length, 1));
  for (const [a, b] of edges) {
    for (let p = 0; p < perEdge && filled < count; p++) {
      const t     = Math.random();
      const noise = (Math.random()-0.5) * 0.04;
      pts[filled*3]   = hx[a] + (hx[b]-hx[a]) * t + noise;
      pts[filled*3+1] = hy[a] + (hy[b]-hy[a]) * t + noise;
      pts[filled*3+2] = (Math.random()-0.5) * 0.05;
      filled++;
    }
  }
  addOutliers(pts, filled, count, scale);
  return pts;
}

// 3 · COORDINATOR AGENT — orchestration, command, pure structure
//   Four concentric authority rings + a tight central nucleus.
//   The outermost ring is broken into arc segments — tasks in flight.
//   Cymatic basis: drumhead modes with discrete azimuthal symmetry.
function coordinatorRings(count, scale = 2.3) {
  const pts   = new Float32Array(count * 3);
  const radii = [0.13, 0.38, 0.65, 0.88, 1.00];
  const weights = [0.08, 0.16, 0.22, 0.26, 0.28];
  let filled = 0;
  const inner = Math.floor(count * 0.93);
  for (let i = 0; i < inner; i++) {
    const rnd = Math.random();
    let ri = 0, acc = 0;
    for (let k = 0; k < weights.length; k++) { acc += weights[k]; if (rnd < acc) { ri = k; break; } }

    const angle  = Math.random() * Math.PI * 2;
    const rNoise = (Math.random()-0.5) * 0.022;
    const r      = (radii[ri] + rNoise) * scale;

    // Outermost ring: broken into 6 arc segments (tasks dispatched)
    if (ri === 4) {
      const seg    = Math.floor(angle / (Math.PI * 2) * 6);
      const gapFrac = hash1(seg * 19.3);
      if (gapFrac < 0.22) { continue; } // gap → skip
    }

    pts[filled*3]   = Math.cos(angle) * r;
    pts[filled*3+1] = Math.sin(angle) * r;
    pts[filled*3+2] = (Math.random()-0.5) * 0.05;
    filled++;
  }
  addOutliers(pts, filled, count, scale);
  return pts;
}

// 4 · EXECUTION AGENT — action, flow, directed force
//   Parallel stream-lines converging radially inward to an action point.
//   Like force-field lines or velocity streamlines — motion with intent.
function executionFlow(count, scale = 2.35) {
  const pts   = new Float32Array(count * 3);
  const STREAMS = 14;
  const inner   = Math.floor(count * 0.93);
  for (let i = 0; i < inner; i++) {
    // pick a stream
    const s     = Math.floor(Math.random() * STREAMS);
    const baseA = (s / STREAMS) * Math.PI * 2;

    // t: 0 = outer origin, 1 = convergence point
    const t = Math.pow(Math.random(), 0.7); // bias toward outer start
    const r = scale * (1.0 - t * 0.92);

    // Streams curve slightly — logarithmic spiral tendency
    const curl  = 0.38 * t;
    const angle = baseA + curl + (Math.random()-0.5)*0.07;

    pts[i*3]   = Math.cos(angle) * r;
    pts[i*3+1] = Math.sin(angle) * r;
    pts[i*3+2] = (Math.random()-0.5) * 0.06 * (1-t);
  }
  addOutliers(pts, inner, count, scale);
  return pts;
}

// 5 · AURA UNIFIED — all agents resolved into one coherent form
//   A cymatic mandala: 6-fold blossom matching the AURA logo shape.
//   Mathematical basis: 6-petal rose curve using |cos(3θ)|.
function auraConvergence(count, scale = 2.7) {
  const pts  = new Float32Array(count * 3);
  let filled = 0;
  const inner   = Math.floor(count * 0.88);
  
  for (let i = 0; i < inner; i++) {
    const rawAngle = Math.random() * Math.PI * 2;
    
    // Generate the 6-leaf blossom form naturally
    const leafRadius = Math.abs(Math.cos(3 * rawAngle));
    
    // Distribute particles across the volume of the leaf instead of just the edge
    const r = leafRadius * Math.pow(Math.random(), 0.6) * scale;
    
    // Slight angular jitter for a fluid/organic feel
    const finalAngle = rawAngle + (Math.random() - 0.5) * 0.18;

    pts[filled*3]   = Math.cos(finalAngle) * r;
    pts[filled*3+1] = Math.sin(finalAngle) * r;
    pts[filled*3+2] = (Math.random() - 0.5) * 0.12;
    filled++;
  }
  
  addOutliers(pts, filled, count, scale);
  return pts;
}

// ─── Build shape library ──────────────────────────────────────────────────────
const shapes = {
  chaos:       chaosField(COUNT),
  voice:       voicePulse(COUNT),        // Language Agent
  neural:      neuralWeb(COUNT),         // Reasoning Agent
  coordinator: coordinatorRings(COUNT),  // Coordinator Agent
  execution:   executionFlow(COUNT),     // Execution Agent
  aura:        auraConvergence(COUNT),   // Unified system
};

// ─── Geometry & attributes ────────────────────────────────────────────────────
const geo = new THREE.BufferGeometry();
const basePos = new Float32Array(COUNT * 3);
const seeds   = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  basePos[i*3]   = shapes.chaos[i*3];
  basePos[i*3+1] = shapes.chaos[i*3+1];
  basePos[i*3+2] = shapes.chaos[i*3+2];
  seeds[i] = Math.random();
}

geo.setAttribute('position', new THREE.BufferAttribute(basePos.slice(), 3));
geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds,   1));
geo.setAttribute('aTargetA', new THREE.BufferAttribute(new Float32Array(COUNT*3), 3));
geo.setAttribute('aTargetB', new THREE.BufferAttribute(new Float32Array(COUNT*3), 3));

// ─── Shader material ──────────────────────────────────────────────────────────
const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite:  false,
  depthTest:   false,
  blending:    THREE.AdditiveBlending,

  uniforms: {
    uTime:     { value: 0 },
    uProgress: { value: 0 },
    uChaos:    { value: 1 },
    uBrightness: { value: 0 },
  },

  vertexShader: `
    uniform float uTime;
    uniform float uProgress;
    uniform float uChaos;

    attribute float aSeed;
    attribute vec3  aTargetA;
    attribute vec3  aTargetB;

    varying float vAlpha;
    varying float vSeed;
    varying float vDist;

    // Simplex-style hash
    float hash(float n){ return fract(sin(n)*43758.5453); }
    vec3 hash3(float n){
      return vec3(hash(n), hash(n+1.1), hash(n+2.3));
    }

    void main(){
      // Morphing
      vec3 pos = mix(aTargetA, aTargetB, uProgress);

      // Cymatic micro-oscillation — physically motivated
      float freq1 = 2.0 + aSeed * 3.0;
      float freq2 = 1.5 + aSeed * 2.5;
      float phase = aSeed * 6.2831;

      float wave = sin(pos.x * freq1 + uTime * 1.8 + phase)
                 * cos(pos.y * freq2 - uTime * 1.4);
      pos.z += wave * 0.07 * uChaos;

      // Outlier dispersal — realistic nodal scattering
      float outlierFactor = step(0.92, aSeed);
      vec3 scatter = hash3(aSeed * 91.7 + uTime * 0.05) - 0.5;
      pos += scatter * outlierFactor * uChaos * 0.6;

      // Grain drift (Brownian-ish micro-motion)
      vec3 drift = vec3(
        sin(uTime * 3.1 + aSeed * 73.1),
        cos(uTime * 2.7 + aSeed * 51.3),
        sin(uTime * 4.3 + aSeed * 29.7)
      ) * (0.003 + 0.012 * uChaos);
      pos += drift;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float depth = 1.0 / (-mv.z + 0.001);

      // Physically-inspired size: larger at nodes, smaller outliers
      float sizeMod = mix(1.0, 0.4, outlierFactor);
      float baseSize = 8.0 * depth * sizeMod;
      float jitter = 0.6 + aSeed * 0.9;
      gl_PointSize = max(0.5, baseSize * jitter);

      gl_Position = projectionMatrix * mv;

      vDist  = length(pos.xy);
      vAlpha = mix(0.7, 0.95, hash(aSeed * 7.3));
      vSeed  = aSeed;
    }
  `,

  fragmentShader: `
    uniform float uTime;
    uniform float uBrightness;
    varying float vAlpha;
    varying float vSeed;
    varying float vDist;

    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if(d > 0.5) discard;

      // Soft gaussian core
      float core = exp(-d * d * 14.0);
      // Hard crystalline grain
      float grain = step(0.38, fract(hash(vSeed * 391.1 + d * 61.3) * 17.0));

      // Apple-native monochrome palette — warm white, slight silver
      float warmth = 0.96 + 0.04 * hash(vSeed * 13.7);
      vec3 base = vec3(warmth, warmth, warmth * 0.97);

      float alpha = vAlpha * mix(core, core*0.65+grain*0.35, 0.4);
      alpha *= (0.4 + uBrightness * 0.6);

      // Edge glow ring
      float ring = smoothstep(0.5, 0.38, d) * smoothstep(0.22, 0.35, d) * 0.35;
      alpha += ring * uBrightness;

      gl_FragColor = vec4(base, alpha);
    }
  `
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ─── Timeline ─────────────────────────────────────────────────────────────────
// Each entry describes a morph FROM one shape TO another.
// `caption` is the name of the DESTINATION — shown only once arrival is complete.
// `dur`     is morph duration in seconds.
// `hold`    is how long to linger on the arrived shape before the next morph.
const timeline = [
  { from: 'chaos',       to: 'voice',       dur: 4.2, hold: 1.6, caption: 'Language'    },
  { from: 'voice',       to: 'neural',      dur: 4.0, hold: 1.4, caption: 'Reasoning'   },
  { from: 'neural',      to: 'coordinator', dur: 4.0, hold: 1.4, caption: 'Coordinator' },
  { from: 'coordinator', to: 'execution',   dur: 4.0, hold: 1.4, caption: 'Execution'   },
  { from: 'execution',   to: 'aura',        dur: 4.5, hold: 2.2, caption: 'AURA'        },
  { from: 'aura',        to: 'chaos',       dur: 3.8, hold: 0.8, caption: ''            },
];

// State machine: 'morph' → 'hold' → advance → 'morph' → ...
let stage    = 0;
let phase    = 'warmup'; // 'warmup' | 'morph' | 'hold'
let phaseT   = 0;        // clock time when current phase started
let captionShown = false;

const labelEl   = document.getElementById('label');
const titleEl   = document.getElementById('title');
const dotEl     = document.getElementById('dot');
const captionEl = document.getElementById('caption');

let captionTimer = null;
function showCaption(text) {
  clearTimeout(captionTimer);
  if (!text) { captionEl.style.opacity = '0'; return; }
  captionEl.textContent = text;
  captionEl.style.opacity = '1';
  captionTimer = setTimeout(() => { captionEl.style.opacity = '0'; }, 2400);
}
function hideCaption() {
  clearTimeout(captionTimer);
  captionEl.style.opacity = '0';
}

setTimeout(() => {
  labelEl.classList.add('visible');
  titleEl.classList.add('visible');
  dotEl.classList.add('visible');
}, 700);

// Write GPU attributes for the current stage — called BEFORE progress resets
function loadStage(i) {
  const s = timeline[i];
  geo.attributes.aTargetA.array.set(shapes[s.from]);
  geo.attributes.aTargetB.array.set(shapes[s.to]);
  geo.attributes.aTargetA.needsUpdate = true;
  geo.attributes.aTargetB.needsUpdate = true;
}

// Quartic ease-in-out — iOS spring feel
function easeApple(t) {
  if (t < 0.5) return 8*t*t*t*t;
  const f = t - 1;
  return 1 - 8*f*f*f*f;
}

// ─── Clock & render loop ──────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  mat.uniforms.uTime.value = t;

  // Subtle camera breath — never distracting
  camera.position.x = Math.sin(t * 0.07) * 0.10;
  camera.position.y = Math.cos(t * 0.05) * 0.07;
  camera.lookAt(0, 0, 0);

  // ── WARMUP: show chaos, fade in, then begin ──────────────────────────────
  if (phase === 'warmup') {
    // Both targets = chaos so progress value is irrelevant — render pure chaos
    geo.attributes.aTargetA.array.set(shapes.chaos);
    geo.attributes.aTargetB.array.set(shapes.chaos);
    geo.attributes.aTargetA.needsUpdate = true;
    geo.attributes.aTargetB.needsUpdate = true;

    mat.uniforms.uProgress.value   = 0;
    mat.uniforms.uChaos.value      = 1.0;
    mat.uniforms.uBrightness.value = Math.min(1, t * 0.5);

    if (t > 1.4) {
      // Transition: load stage 0, reset progress to exactly 0 first
      mat.uniforms.uProgress.value = 0;
      loadStage(0);
      stage    = 0;
      phase    = 'morph';
      phaseT   = t;
      captionShown = false;
      hideCaption();
    }
    renderer.render(scene, camera);
    return;
  }

  const s = timeline[stage];

  // ── MORPH phase ──────────────────────────────────────────────────────────
  if (phase === 'morph') {
    const elapsed  = t - phaseT;
    const raw      = Math.min(elapsed / s.dur, 1.0);
    const progress = easeApple(raw);

    // Write uniforms every frame — never skip
    mat.uniforms.uProgress.value   = progress;
    mat.uniforms.uChaos.value      = 1.0 - progress * 0.88;
    mat.uniforms.uBrightness.value = 0.55 + 0.45 * Math.sin(progress * Math.PI);

    // At ~85 % through the morph, shape is clearly legible — show caption
    if (!captionShown && raw > 0.85) {
      showCaption(s.caption);
      captionShown = true;
    }

    if (raw >= 1.0) {
      // Morph complete — clamp progress firmly to 1 for this frame
      mat.uniforms.uProgress.value = 1.0;
      renderer.render(scene, camera);

      // Switch to hold phase
      phase  = 'hold';
      phaseT = t;
      renderer.render(scene, camera);
      return;
    }

    renderer.render(scene, camera);
    return;
  }

  // ── HOLD phase — shape fully arrived, settling ───────────────────────────
  if (phase === 'hold') {
    const elapsed = t - phaseT;

    // Keep progress pinned at 1 — display the fully arrived "to" shape
    mat.uniforms.uProgress.value   = 1.0;
    mat.uniforms.uChaos.value      = 0.12;
    mat.uniforms.uBrightness.value = 0.85 + 0.10 * Math.sin(elapsed * 1.2);

    if (elapsed >= s.hold) {
      // Advance to next stage — reset progress BEFORE loadStage so the
      // GPU never sees (newTargets, progress=1) in the same frame.
      mat.uniforms.uProgress.value = 0;

      stage = (stage + 1) % timeline.length;
      loadStage(stage);

      phase  = 'morph';
      phaseT = t;
      captionShown = false;
      hideCaption();
    }

    renderer.render(scene, camera);
    return;
  }
}

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
